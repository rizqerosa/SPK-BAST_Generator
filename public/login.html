<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sistem SPK &amp; BAST Generator BPS Kota Subulussalam</title>
  <meta name="description" content="Halaman Masuk Sistem Generator SPK dan BAST BPS Kota Subulussalam">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=4.0">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #1d4ed8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 20px;
      margin: 0;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      width: 450px;
      height: 450px;
      background: rgba(59, 130, 246, 0.15);
      border-radius: 50%;
      top: -100px;
      left: -100px;
      filter: blur(80px);
    }

    body::after {
      content: '';
      position: absolute;
      width: 350px;
      height: 350px;
      background: rgba(147, 51, 234, 0.15);
      border-radius: 50%;
      bottom: -80px;
      right: -80px;
      filter: blur(80px);
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 10;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      border-radius: var(--radius-xl);
      padding: 36px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-brand-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: #fff;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 16px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    }

    .login-header h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--gray-900);
      margin: 0 0 6px;
    }

    .login-header p {
      font-size: 0.84rem;
      color: var(--gray-500);
      margin: 0;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      font-size: 0.83rem;
      font-weight: 700;
      color: var(--gray-700);
      margin-bottom: 6px;
      display: block;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      color: var(--gray-400);
      pointer-events: none;
    }

    .form-control-icon {
      padding-left: 42px !important;
      height: 46px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      border: 1.5px solid var(--gray-200);
      transition: all 0.2s ease;
    }

    .form-control-icon:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    .btn-login {
      width: 100%;
      height: 48px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      border: none;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.45);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .quick-login-box {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px dashed var(--gray-300);
      text-align: center;
    }

    .quick-login-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .quick-btn-group {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .btn-quick {
      flex: 1;
      padding: 8px 10px;
      font-size: 0.76rem;
      font-weight: 700;
      border-radius: var(--radius-md);
      border: 1px solid var(--gray-300);
      background: #f8fafc;
      color: var(--gray-700);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .btn-quick:hover {
      background: #eff6ff;
      border-color: #3b82f6;
      color: #1e3a8a;
      transform: translateY(-1px);
    }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.78rem;
    }

    .alert-error {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.82rem;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="login-brand-icon">📜</div>
      <h1>Dokumen Keuangan Generator</h1>
      <p>Sistem Otorisasi &amp; Verifikasi SPK / BAST BPS Kota Subulussalam</p>
    </div>

    <div class="alert-error" id="login-error">
      <span>⚠️</span> <span id="login-error-msg">Username atau password salah</span>
    </div>

    <form id="form-login" action="javascript:void(0);">
      <div class="form-group">
        <label class="form-label" for="login-username">Username</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" id="login-username" class="form-control form-control-icon"
                 placeholder="Masukkan username Anda..." required autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="login-password" class="form-control form-control-icon"
                 placeholder="Masukkan password Anda..." required autocomplete="current-password">
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <label style="display:flex; align-items:center; gap:6px; font-size:0.82rem; color:var(--gray-600); cursor:pointer;">
          <input type="checkbox" id="login-remember"> Ingat Saya
        </label>
      </div>

      <button type="submit" class="btn-login" id="btn-submit-login">
        <span>🔑 Masuk ke Sistem</span>
      </button>
    </form>

    <!-- End Form Login -->
  </div>

  <div class="login-footer">
    BPS Kota Subulussalam &copy; 2026 — Web Generator SPK &amp; BAST
  </div>
</div>

<script src="js/config.js?v=4.0"></script>
<script src="js/data.js?v=4.0"></script>
<script src="js/auth.js?v=4.0"></script>
<script>
  document.getElementById("form-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const userVal = document.getElementById("login-username").value;
    const passVal = document.getElementById("login-password").value;
    const rememberVal = document.getElementById("login-remember").checked;
    const errBox = document.getElementById("login-error");
    const btn = document.getElementById("btn-submit-login");

    errBox.style.display = "none";
    btn.disabled = true;
    btn.innerHTML = "⏳ Memproses...";

    try {
      const loggedUser = await Auth.login(userVal, passVal, rememberVal);
      // Redirect sesuai role
      const params = new URLSearchParams(window.location.search);
      const redirectTarget = params.get("redirect");

      if (redirectTarget) {
        window.location.href = redirectTarget;
      } else if (loggedUser.role === "PPK") {
        window.location.href = "verifikasi-ppk.html";
      } else {
        window.location.href = "index.html";
      }
    } catch (err) {
      errBox.style.display = "flex";
      document.getElementById("login-error-msg").textContent = err.message;
    } finally {
      btn.disabled = false;
      btn.innerHTML = "🔑 Masuk ke Sistem";
    }
  });
</script>
</body>
</html>
